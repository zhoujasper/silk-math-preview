name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package VSIX
        run: npm run package:all
      - run: npm run check:size
      - name: Inspect VSIX
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          VSIX="silk-math-preview-${VERSION}.vsix"
          TEST_VSIX="silk-math-preview-test-${VERSION}.vsix"
          echo "VSIX=$VSIX"
          echo "TEST_VSIX=$TEST_VSIX"
          python3 - <<'PY'
          import json, zipfile, sys
          version = json.load(open("package.json"))["version"]
          official = f"silk-math-preview-{version}.vsix"
          test = f"silk-math-preview-test-{version}.vsix"
          required = (
              "extension/package.json",
              "extension/dist/extension.js",
              "extension/dist/render-worker.js",
              "extension/readme.md",
              "extension/media/icon.png",
          )
          for path, expect_name, expect_private in ((official, "silk-math-preview", False), (test, "silk-math-preview-test", True)):
              names = zipfile.ZipFile(path).namelist()
              missing = [name for name in required if name not in names]
              if missing:
                  sys.exit(f"{path} missing {missing}")
              banned = [name for name in names if "/test/" in name or name.endswith(".map") or "/src/" in name]
              if banned:
                  sys.exit(f"{path} must not include {banned[:8]}")
              manifest = json.loads(zipfile.ZipFile(path).read("extension/package.json"))
              if manifest["name"] != expect_name:
                  sys.exit(f"{path} name={manifest['name']} expected {expect_name}")
              if bool(manifest.get("private")) != expect_private:
                  sys.exit(f"{path} private={manifest.get('private')} expected {expect_private}")
              print(f"ok {path} entries={len(names)} id={manifest['publisher']}.{manifest['name']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: silk-math-preview-vsix
          path: |
            silk-math-preview-*.vsix
          if-no-files-found: error

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: silk-math-preview-vsix
          path: .
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          VSIX="silk-math-preview-${VERSION}.vsix"
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning::Repository secret VSCE_PAT is not set. Skipping Marketplace publish. See docs/PUBLISH.md"
            exit 0
          fi
          npx vsce publish --packagePath "$VSIX" --skip-duplicate
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          VSIX="silk-math-preview-${VERSION}.vsix"
          TEST_VSIX="silk-math-preview-test-${VERSION}.vsix"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$VSIX" "$TEST_VSIX" --clobber
          else
            gh release create "$VERSION" "$VSIX" "$TEST_VSIX" --title "$VERSION" --generate-notes --target "$GITHUB_SHA"
          fi
